name: VFPGA-S3 CI

on: [push, pull_request]

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run

  hdl-toolchain-host-test:
    # Requires a C++17-capable g++ (ubuntu-latest provides it).
    # Not runnable on pre-C++17 toolchains (e.g., MinGW GCC 6.x):
    # src/hdl/netlist.cpp uses C++17 structured bindings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile HDL toolchain with host g++
        run: |
          g++ -std=c++17 -Wall -Isrc/hdl -Ihost_test/stubs \
            host_test/test_hdl.cpp \
            src/hdl/lexer.cpp src/hdl/parser.cpp \
            src/hdl/netlist.cpp src/hdl/mapper.cpp \
            src/hdl/verilog_emit.cpp \
            -o /tmp/test_hdl
      - name: Run HDL toolchain tests
        run: /tmp/test_hdl

  sim-core-host-test:
    # Host-only simulator core (host_test/simulator): HDL -> netlist ->
    # mapper -> Simulator. Needs C++17 like the toolchain job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile simulator core test with host g++
        run: |
          g++ -std=c++17 -Wall -Isrc/hdl -Ihost_test/stubs \
            -Ihost_test/simulator \
            host_test/simulator/test_sim.cpp \
            host_test/simulator/sim.cpp \
            src/hdl/lexer.cpp src/hdl/parser.cpp \
            src/hdl/netlist.cpp src/hdl/mapper.cpp \
            -o /tmp/test_sim
      - name: Run simulator core tests
        run: /tmp/test_sim

  sim-tb-vcd-test:
    # Testbench DSL + executor + VCD writer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile TB and VCD tests with host g++
        run: |
          g++ -std=c++17 -Wall -Isrc/hdl -Ihost_test/stubs \
            -Ihost_test/simulator -Ihost_test/waveform -Ihost_test/testbench \
            host_test/testbench/test_tb.cpp \
            host_test/testbench/tb.cpp host_test/testbench/tb_exec.cpp \
            host_test/testbench/auto_tb.cpp \
            host_test/waveform/vcd.cpp \
            host_test/simulator/sim.cpp \
            src/hdl/lexer.cpp src/hdl/parser.cpp \
            src/hdl/netlist.cpp src/hdl/mapper.cpp \
            -o /tmp/test_tb
          g++ -std=c++17 -Wall -Isrc/hdl -Ihost_test/stubs \
            -Ihost_test/simulator -Ihost_test/waveform \
            host_test/waveform/test_vcd.cpp \
            host_test/waveform/vcd.cpp \
            host_test/simulator/sim.cpp \
            src/hdl/lexer.cpp src/hdl/parser.cpp \
            src/hdl/netlist.cpp src/hdl/mapper.cpp \
            -o /tmp/test_vcd
      - name: Run TB and VCD tests
        run: /tmp/test_tb && /tmp/test_vcd

  sim-cli-smoke:
    # End-to-end CLI: compile/signals/sim/verify over examples + tutorials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build vfpga CLI with host g++
        run: |
          g++ -std=c++17 -Wall -Isrc/hdl -Ihost_test/stubs \
            -Ihost_test/simulator -Ihost_test/waveform -Ihost_test/testbench \
            -Ihost_test/physical \
            tools/cli/main.cpp \
            host_test/simulator/sim.cpp \
            host_test/testbench/tb.cpp host_test/testbench/tb_exec.cpp \
            host_test/testbench/auto_tb.cpp \
            host_test/waveform/vcd.cpp host_test/waveform/gtkwave.cpp \
            host_test/physical/physical_design.cpp \
            src/hdl/lexer.cpp src/hdl/parser.cpp \
            src/hdl/netlist.cpp src/hdl/mapper.cpp \
            -o /tmp/vfpga
      - name: CLI smoke over examples
        run: |
          /tmp/vfpga compile examples/counter.v
          /tmp/vfpga signals examples/counter.v
          /tmp/vfpga sim examples/counter.v --wave
          /tmp/vfpga verify examples/counter.v --wave
          test -f build/waves/counter.vcd
      - name: CLI verify over tutorials
        run: |
          for t in 01_and_gate 02_mux 03_half_adder 04_full_adder \
                   05_register 06_counter 07_shift_register 08_fsm; do
            /tmp/vfpga verify examples/tutorial/$t/design.v \
              --tb examples/tutorial/$t/design.tb --wave || exit 1
          done
      - name: CLI physical flow over examples
        run: |
          /tmp/vfpga map examples/physical/and.v --target asic
          /tmp/vfpga build examples/physical/counter.v --svg
          test -f build/physical/counter.layout.json
          /tmp/vfpga report examples/physical/mux.v

  sim-physical-test:
    # Educational ASIC backend (host_test/physical). Needs C++17.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile physical engine test with host g++
        run: |
          g++ -std=c++17 -Wall -Isrc/hdl -Ihost_test/stubs \
            -Ihost_test/physical \
            host_test/physical/test_physical.cpp \
            host_test/physical/physical_design.cpp \
            src/hdl/lexer.cpp src/hdl/parser.cpp \
            src/hdl/netlist.cpp src/hdl/mapper.cpp \
            -o /tmp/test_physical
      - name: Run physical engine tests
        run: /tmp/test_physical

  verilog-sim-synth:
    # Simulates the VerilogEmitter golden outputs; `+` agrees via the
    # toolchain's ripple-carry logic, so counter equivalence holds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog and Yosys
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Simulate emitted designs
        run: |
          for tb in tb_and tb_xor tb_counter tb_blinker; do
            iverilog -Ihost_test -o /tmp/$tb host_test/$tb.v || exit 1
            vvp /tmp/$tb | tee /tmp/$tb.log || exit 1
            grep -q "PASS" /tmp/$tb.log || exit 1
            if grep -q "FAIL" /tmp/$tb.log; then exit 1; fi
          done
      - name: Synthesis smoke test (counter)
        run: |
          yosys -p "read_verilog host_test/golden_counter.v; synth -top counter; stat" \
            | tee /tmp/yosys.log
          grep -q "Number of cells" /tmp/yosys.log
